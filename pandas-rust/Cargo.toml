[package]
name = "quant1x-pandas"
version = "0.0.0" # 占位；发布流程接管版本
edition = "2024"
publish = false

[lib]
name = "quant1x_pandas"
path = "src/lib.rs"

[dependencies]
quant1x-num = { path = "../../num" }

[dev-dependencies]
# ONNX 推理（M8）：只动态加载，构建期不下载二进制；运行时用 ORT_DYLIB_PATH 指定库
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
